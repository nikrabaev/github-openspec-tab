<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- Synthetic diagram for fixtures: the group unlock flow. -->
  <rect width="760" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/>
    </marker>
  </defs>
  <g fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round">
    <rect x="24" y="40" width="150" height="64" rx="12" fill="#a5d8ff"/>
    <rect x="234" y="40" width="170" height="64" rx="12" fill="#b2f2bb"/>
    <rect x="464" y="40" width="130" height="64" rx="12" fill="#ffec99"/>
    <rect x="234" y="190" width="170" height="64" rx="12" fill="#ffc9c9"/>
    <rect x="464" y="190" width="270" height="64" rx="12" fill="#eebefa"/>
    <path d="M 174 72 L 232 72" marker-end="url(#arrow)"/>
    <path d="M 404 72 L 462 72" marker-end="url(#arrow)"/>
    <path d="M 319 104 L 319 188" marker-end="url(#arrow)"/>
    <path d="M 404 222 L 462 222" marker-end="url(#arrow)"/>
    <path d="M 594 72 C 680 72 680 140 620 188" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
  </g>
  <g fill="#1e1e1e" text-anchor="middle">
    <text x="99" y="68">Rider app</text>
    <text x="99" y="88" font-size="12">scan bike 2..4</text>
    <text x="319" y="68">Unlock service</text>
    <text x="319" y="88" font-size="12">pass + station check</text>
    <text x="529" y="68">Dock</text>
    <text x="529" y="88" font-size="12">release</text>
    <text x="319" y="218">group_ride</text>
    <text x="319" y="238" font-size="12">leader, station</text>
    <text x="599" y="218">ride (one per bike)</text>
    <text x="599" y="238" font-size="12">group_ride_id links them</text>
    <text x="204" y="62" font-size="12">1</text>
    <text x="434" y="62" font-size="12">2</text>
    <text x="336" y="150" font-size="12">3</text>
    <text x="672" y="130" font-size="12">confirmed</text>
  </g>
</svg>
